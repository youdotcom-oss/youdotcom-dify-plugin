    type: number
    required: false
    form: llm
    label:
      en_US: "Max wait seconds"
      zh_Hans: "最长等待秒数"
      ja_JP: "最大待機秒数"
    human_description:
      en_US: "Only used for frontier. How long to poll the background task before returning the task id, from 15 to 300. Default is 180."
      zh_Hans: "仅用于 frontier。轮询后台任务的最长秒数，15 到 300。默认 180。超时后返回任务编号。"
      ja_JP: "frontier のときだけ使う。バックグラウンドタスクを待つ最大秒数。15 から 300。既定は 180。"
    llm_description: "Frontier only. Seconds to poll before returning the task id. 15 to 300, default 180."
    default: 180
    min: 15
    max: 300
