identity:
  name: youcom_research
  author: youdotcom
  label:
    en_US: "You.com Research"
    zh_Hans: "You.com 研究"
    ja_JP: "You.com リサーチ"
description:
  human:
    en_US: "Run a multi-step research question and return a cited answer. Choose how much effort to spend. Frontier is submitted as a background task and polled until the wait limit."
    zh_Hans: "对一个需要多步检索的问题进行研究，并返回答案和引用。可以选择花费多少力度。frontier 会作为后台任务提交，并轮询到等待上限。"
    ja_JP: "複数ステップが必要な質問を調査し、引用付きの回答を返す。力度を選べる。frontier はバックグラウンドタスクとして送り、待機上限までポーリングする。"
  llm: >
    Deep cited research via the You.com Research API. research_effort is lite, standard, deep, exhaustive, or frontier. Optional source controls and a JSON schema.
parameters:
  - name: input
    type: string
    required: true
    form: llm
    label:
      en_US: "Question"
      zh_Hans: "问题"
      ja_JP: "質問"
    human_description:
      en_US: "The research question. Maximum 40,000 characters."
      zh_Hans: "研究问题。最多 40000 个字符。"
      ja_JP: "調査する質問。最大 40000 文字。"
    llm_description: "Research question, up to 40000 characters."
  - name: research_effort
    type: select
    required: false
    form: llm
    label:
      en_US: "Research effort"
      zh_Hans: "研究力度"
      ja_JP: "調査の力度"
    human_description:
      en_US: "lite is under about 10 seconds. standard is the default, about 10 to 30 seconds. deep is under 120 seconds. exhaustive is under 300 seconds. frontier runs in the background and can take much longer. This tool waits up to Max wait seconds, then returns the task id if it is still running."
      zh_Hans: "lite 大约 10 秒内。standard 是默认值，大约 10 到 30 秒。deep 在 120 秒内。exhaustive 在 300 秒内。frontier 在后台运行，可能久得多。本工具最多等待最长等待秒数，若仍在运行则返回任务编号。"
      ja_JP: "lite は約 10 秒以内。standard が既定で約 10 から 30 秒。deep は 120 秒以内。exhaustive は 300 秒以内。frontier はバックグラウンドで、ずっと長くなり得る。このツールは最大待機秒数まで待ち、まだ実行中ならタスク ID を返す。"
    llm_description: "lite, standard (default), deep, exhaustive, or frontier. frontier is submitted with background true and polled until max_wait_seconds."
    default: standard
    options:
      - label:
          en_US: "Lite"
          zh_Hans: "快速"
          ja_JP: "ライト"
        value: lite
      - label:
          en_US: "Standard"
          zh_Hans: "标准"
          ja_JP: "標準"
        value: standard
      - label:
          en_US: "Deep"
          zh_Hans: "深入"
          ja_JP: "ディープ"
        value: deep
      - label:
          en_US: "Exhaustive"
          zh_Hans: "穷尽"
          ja_JP: "徹底"
        value: exhaustive
      - label:
          en_US: "Frontier"
          zh_Hans: "前沿"
          ja_JP: "フロンティア"
        value: frontier
  - name: freshness
    type: select
    required: false
    form: llm
    label:
      en_US: "Freshness"
      zh_Hans: "时效"
      ja_JP: "新しさ"
    human_description:
      en_US: "Beta source control. Limit sources to the past day, week, month, or year."
      zh_Hans: "Beta 来源控制。将来源限制在过去一天、一周、一月或一年。"
      ja_JP: "ベータのソース制御。情報源を過去1日、1週間、1か月、1年に限る。"
    llm_description: "Optional source_control freshness: day, week, month, or year."
    default: not_specified
    options:
      - label:
          en_US: "Not specified"
          zh_Hans: "不指定"
          ja_JP: "指定しない"
        value: not_specified
      - label:
          en_US: "Past day"
          zh_Hans: "过去一天"
          ja_JP: "過去1日"
        value: day
      - label:
          en_US: "Past week"
          zh_Hans: "过去一周"
          ja_JP: "過去1週間"
        value: week
      - label:
          en_US: "Past month"
          zh_Hans: "过去一月"
          ja_JP: "過去1か月"
        value: month
      - label:
          en_US: "Past year"
          zh_Hans: "过去一年"
          ja_JP: "過去1年"
        value: year
  - name: freshness_range
    type: string
    required: false
    form: llm
    label:
      en_US: "Freshness range"
      zh_Hans: "时效范围"
      ja_JP: "期間"
    human_description:
      en_US: "Beta source control. Exact window YYYY-MM-DDtoYYYY-MM-DD. Overrides Freshness when set."
      zh_Hans: "Beta 来源控制。精确窗口 YYYY-MM-DDtoYYYY-MM-DD。设置后覆盖时效预设。"
      ja_JP: "ベータのソース制御。YYYY-MM-DDtoYYYY-MM-DD。指定すると新しさより優先される。"
    llm_description: "Optional source_control date window YYYY-MM-DDtoYYYY-MM-DD."
  - name: country
    type: select
    required: false
    form: llm
    label:
      en_US: "Country"
      zh_Hans: "国家或地区"
      ja_JP: "国"
    human_description:
      en_US: "Beta source control. Country code that focuses web results."
      zh_Hans: "Beta 来源控制。决定网页结果地理侧重的国家或地区代码。"
      ja_JP: "ベータのソース制御。ウェブ結果の焦点になる国コード。"
    llm_description: "Optional source_control country code."
    default: not_specified
    options:
