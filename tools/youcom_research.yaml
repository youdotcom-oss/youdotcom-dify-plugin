    required: false
    form: llm
    label:
      en_US: "Output schema"
      zh_Hans: "输出结构"
      ja_JP: "出力スキーマ"
    human_description:
      en_US: "Optional JSON Schema object. When set, output.content is JSON instead of Markdown. Not accepted with lite. The root must be an object with additionalProperties false, and every property must be required."
      zh_Hans: "可选的 JSON Schema 对象。设置后 output.content 是 JSON 而不是 Markdown。不能与 lite 同时使用。根必须是对象，additionalProperties 为 false，且每个属性都在 required 中。"
      ja_JP: "任意の JSON Schema オブジェクト。指定すると output.content は Markdown ではなく JSON になる。lite では使えない。ルートはオブジェクトで、additionalProperties は false、すべてのプロパティが required に必要。"
    llm_description: "Optional JSON Schema object. output.content becomes JSON. Not valid with research_effort lite."
