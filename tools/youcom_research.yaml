  - name: include_domains
    type: string
    required: false
    form: llm
    label:
      en_US: "Include domains"
      zh_Hans: "仅包含域名"
      ja_JP: "含めるドメイン"
    human_description:
      en_US: "Beta source control. Allowlist up to 500 domains. Cannot be combined with exclude or boost domains."
      zh_Hans: "Beta 来源控制。允许域名最多 500 个。不能与排除或加权域名同时使用。"
      ja_JP: "ベータのソース制御。許可ドメインは最大 500。除外やブーストとは併用できない。"
    llm_description: "Optional source_control allowlist, up to 500 domains. Do not combine with exclude_domains or boost_domains."
  - name: exclude_domains
    type: string
    required: false
    form: llm
    label:
      en_US: "Exclude domains"
      zh_Hans: "排除域名"
      ja_JP: "除外するドメイン"
    human_description:
      en_US: "Beta source control. Denylist up to 500 domains. The research agent will not visit these domains. Cannot be combined with include domains."
      zh_Hans: "Beta 来源控制。排除域名最多 500 个。研究过程不会访问这些域名。不能与仅包含域名同时使用。"
      ja_JP: "ベータのソース制御。除外ドメインは最大 500。調査はこのドメインを訪れない。含めるドメインとは併用できない。"
    llm_description: "Optional source_control denylist, up to 500 domains. Do not combine with include_domains."
  - name: boost_domains
    type: string
    required: false
    form: llm
    label:
      en_US: "Boost domains"
      zh_Hans: "加权域名"
      ja_JP: "ブーストするドメイン"
    human_description:
      en_US: "Beta source control. Domains to rank higher, up to 500. Can be combined with exclude domains, not with include domains."
      zh_Hans: "Beta 来源控制。加权域名最多 500 个。可以与排除域名同时使用，不能与仅包含域名同时使用。"
      ja_JP: "ベータのソース制御。順位を上げるドメイン、最大 500。除外とは併用でき、含めるドメインとは併用できない。"
    llm_description: "Optional source_control boost list, up to 500 domains. Not valid with include_domains."
  - name: output_schema
