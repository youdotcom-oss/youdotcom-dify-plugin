identity:
  name: youdotcom_answer
  author: youdotcom
  label:
    en_US: "You.com Answer"
    zh_Hans: "You.com 回答"
    ja_JP: "You.com 回答"
description:
  human:
    en_US: "Get one grounded answer with inline citations from a single query. This calls the Answer API. It is not the Research API, and it has no model or research-effort parameter."
    zh_Hans: "用一次查询得到带行内引用的依据答案。调用的是 Answer API，不是 Research API，也没有模型或研究力度参数。"
    ja_JP: "1 回のクエリから、本文中に引用が付いた根拠のある回答を得る。呼ぶのは Answer API であり、Research API ではない。モデルや調査力度のパラメータはない。"
  llm: >
    Return a cited answer from the You.com Answer API for one query. This is not a research effort and not a selectable model.
parameters:
  - name: query
    type: string
    required: true
    form: llm
    label:
      en_US: "Query"
      zh_Hans: "问题"
      ja_JP: "質問"
    human_description:
      en_US: "The question to answer from current web results."
      zh_Hans: "要用当前网页结果回答的问题。"
      ja_JP: "現在のウェブ結果から答える質問。"
    llm_description: "The question to answer from current web results."
  - name: freshness
    type: select
    required: false
    form: llm
    label:
      en_US: "Freshness"
      zh_Hans: "时效"
      ja_JP: "新しさ"
    human_description:
      en_US: "Limit supporting results to the past day, week, month, or year."
      zh_Hans: "将支撑结果限制在过去一天、一周、一月或一年。"
      ja_JP: "根拠にする結果を過去1日、1週間、1か月、1年に限る。"
    llm_description: "Recency preset for supporting results: day, week, month, or year."
    default: not_specified
    options:
      - label:
          en_US: "Not specified"
          zh_Hans: "不指定"
          ja_JP: "指定しない"
        value: not_specified
      - label:
          en_US: "Past day"
          zh_Hans: "过去一天"
          ja_JP: "過去1日"
        value: day
      - label:
          en_US: "Past week"
          zh_Hans: "过去一周"
          ja_JP: "過去1週間"
        value: week
      - label:
          en_US: "Past month"
          zh_Hans: "过去一月"
          ja_JP: "過去1か月"
        value: month
      - label:
          en_US: "Past year"
          zh_Hans: "过去一年"
          ja_JP: "過去1年"
        value: year
  - name: freshness_range
    type: string
    required: false
    form: llm
    label:
      en_US: "Freshness range"
      zh_Hans: "时效范围"
      ja_JP: "期間"
    human_description:
      en_US: "Optional exact window, YYYY-MM-DDtoYYYY-MM-DD. Overrides Freshness when set."
      zh_Hans: "可选精确日期窗口，YYYY-MM-DDtoYYYY-MM-DD。设置后覆盖时效预设。"
      ja_JP: "任意の正確な期間。YYYY-MM-DDtoYYYY-MM-DD。指定すると新しさより優先される。"
    llm_description: "Optional date window YYYY-MM-DDtoYYYY-MM-DD. Overrides the freshness preset."
  - name: country
