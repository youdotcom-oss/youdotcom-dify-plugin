      zh_Hans: "highlights 的大致 token 上限，1024 到 8192。仅 highlights 模式有效。API 默认 8192。"
      ja_JP: "highlights のおおよそのトークン上限。1024 から 8192。highlights のときだけ有効。API の既定は 8192。"
    llm_description: "Optional shared token budget for highlights, 1024 to 8192. Only with extraction_mode highlights."
    min: 1024
    max: 8192
  - name: crawl_timeout
    type: number
    required: false
    form: llm
    label:
      en_US: "Crawl timeout"
      zh_Hans: "抓取超时"
      ja_JP: "クロールのタイムアウト"
    human_description:
      en_US: "Seconds to wait for a full page fetch, from 1 to 60. Only valid with full page. The API default is 10."
      zh_Hans: "整页抓取的等待秒数，1 到 60。仅整页模式有效。API 默认 10。"
      ja_JP: "ページ全体の取得を待つ秒数。1 から 60。full page のときだけ有効。API の既定は 10。"
    llm_description: "Seconds to wait for full_page content, from 1 to 60. Only with extraction_mode full_page."
    min: 1
    max: 60
  - name: strict_operators
    type: boolean
    required: false
