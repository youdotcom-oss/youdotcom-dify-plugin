          zh_Hans: "Markdown"
          ja_JP: "Markdown"
        value: markdown
      - label:
          en_US: "HTML"
          zh_Hans: "HTML"
          ja_JP: "HTML"
        value: html
      - label:
          en_US: "Markdown and HTML"
          zh_Hans: "Markdown 和 HTML"
          ja_JP: "Markdown と HTML"
        value: both
  - name: highlights_total_max_tokens
    type: number
    required: false
    form: llm
    label:
