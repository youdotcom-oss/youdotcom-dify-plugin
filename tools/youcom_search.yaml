    human_description:
      en_US: "Comma-separated domains to rank higher without dropping other results. Up to 500. Cannot be combined with include domains."
      zh_Hans: "逗号分隔的加权域名，最多 500 个。只提高排序，不过滤其他结果。不能与仅包含域名同时使用。"
