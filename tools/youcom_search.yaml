      ja_JP: "カンマ区切りの許可ドメイン。最大 500。除外ドメインやブーストドメインとは併用できない。"
    llm_description: "Comma-separated domain allowlist, up to 500. Do not combine with exclude_domains or boost_domains."
  - name: exclude_domains
    type: string
    required: false
    form: llm
    label:
      en_US: "Exclude domains"
