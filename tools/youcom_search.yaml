    llm_description: "Comma-separated domains to boost in ranking, up to 500. This is not a filter. Do not combine with include_domains."
  - name: knowledge
    type: select
    required: false
    form: llm
    label:
      en_US: "Knowledge"
      zh_Hans: "知识结果"
      ja_JP: "ナレッジ"
    human_description:
      en_US: "Set to core to add licensed and public knowledge results at no extra cost. Off returns web results only."
      zh_Hans: "设为 core 会额外返回授权和公开知识结果，不另收费。off 只返回网页结果。"
      ja_JP: "core にすると、追加料金なしでライセンスおよび公開ナレッジ結果が付く。off はウェブ結果のみ。"
    llm_description: "Set to core to request knowledge results alongside web results. Off omits the knowledge parameter."
    default: off
    options:
      - label:
          en_US: "Off"
          zh_Hans: "关闭"
          ja_JP: "オフ"
        value: off
      - label:
          en_US: "Core"
          zh_Hans: "核心"
          ja_JP: "コア"
        value: core
