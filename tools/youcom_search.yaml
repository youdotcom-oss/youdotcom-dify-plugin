identity:
  name: youcom_search
  author: youdotcom
  label:
    en_US: "You.com Search"
    zh_Hans: "You.com 搜索"
    ja_JP: "You.com 検索"
description:
  human:
    en_US: "Search the live web. News articles are returned in the same results list when the query has news intent. Snippets are the default. Ask for highlights or a full page when you need more of the document."
    zh_Hans: "搜索实时网页。查询带有新闻意图时，新闻文章会出现在同一结果列表中。默认返回摘要片段。需要更多正文时再请求相关段落或整页。"
    ja_JP: "ライブのウェブを検索する。クエリにニュースの意図があるとき、ニュース記事は同じ結果リストに入る。既定はスニペット。文書のより多くの部分が要るときはハイライトかページ全体を指定する。"
  llm: >
    Search the live web with You.com. News results are included in results.web when the query has news intent. Use count, freshness, country, language, safesearch, domain filters, and optional highlights or full-page content.
parameters:
  - name: query
    type: string
    required: true
    form: llm
    label:
      en_US: "Query"
      zh_Hans: "查询"
      ja_JP: "クエリ"
    human_description:
      en_US: "The search query. Search operators such as site:, filetype:, AND, OR, and minus are supported."
      zh_Hans: "搜索查询。支持 site:、filetype:、AND、OR 和减号等搜索运算符。"
      ja_JP: "検索クエリ。site:、filetype:、AND、OR、マイナスなどの検索演算子を使えます。"
    llm_description: "Search query. Operators such as site:, filetype:, AND, OR, and a leading minus are supported."
  - name: count
    type: number
    required: false
    form: llm
    label:
      en_US: "Count"
      zh_Hans: "结果数量"
      ja_JP: "件数"
    human_description:
      en_US: "Maximum number of results, from 1 to 100. Highlights mode allows at most 50. Default is 10."
      zh_Hans: "返回的最大结果数，1 到 100。highlights 模式最多 50 条。默认 10。"
      ja_JP: "返す最大件数。1 から 100。highlights では最大 50。既定は 10。"
    llm_description: "Maximum results to return, from 1 to 100. When extraction_mode is highlights, the maximum is 50. Default 10."
    default: 10
    min: 1
    max: 100
  - name: freshness
    type: select
    required: false
    form: llm
    label:
      en_US: "Freshness"
      zh_Hans: "时效"
      ja_JP: "新しさ"
    human_description:
      en_US: "Limit results to the past day, week, month, or year. Use Freshness range for an exact window."
      zh_Hans: "将结果限制在过去一天、一周、一月或一年。精确日期窗口请用时效范围。"
      ja_JP: "結果を過去1日、1週間、1か月、1年に限る。正確な期間は期間パラメータを使う。"
    llm_description: "Recency preset: day, week, month, or year. Leave unset for no recency filter. For an exact window, set freshness_range instead."
    default: not_specified
    options:
      - label:
          en_US: "Not specified"
          zh_Hans: "不指定"
          ja_JP: "指定しない"
        value: not_specified
      - label:
          en_US: "Past day"
          zh_Hans: "过去一天"
          ja_JP: "過去1日"
        value: day
      - label:
          en_US: "Past week"
          zh_Hans: "过去一周"
          ja_JP: "過去1週間"
        value: week
      - label:
          en_US: "Past month"
          zh_Hans: "过去一月"
          ja_JP: "過去1か月"
        value: month
      - label:
          en_US: "Past year"
          zh_Hans: "过去一年"
          ja_JP: "過去1年"
        value: year
  - name: freshness_range
    type: string
    required: false
    form: llm
    label:
      en_US: "Freshness range"
      zh_Hans: "时效范围"
      ja_JP: "期間"
    human_description:
      en_US: "Optional exact window, formatted YYYY-MM-DDtoYYYY-MM-DD, such as 2026-01-01to2026-03-31. Overrides Freshness when set."
      zh_Hans: "可选的精确日期窗口，格式为 YYYY-MM-DDtoYYYY-MM-DD，例如 2026-01-01to2026-03-31。设置后覆盖时效预设。"
      ja_JP: "任意の正確な期間。形式は YYYY-MM-DDtoYYYY-MM-DD（例: 2026-01-01to2026-03-31）。指定すると新しさのプリセットより優先される。"
    llm_description: "Optional date window YYYY-MM-DDtoYYYY-MM-DD. When set, it overrides the freshness preset."
  - name: country
