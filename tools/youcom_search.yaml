      - label:
          en_US: "Full page"
          zh_Hans: "整页"
          ja_JP: "ページ全体"
        value: full_page
  - name: extraction_source
    type: select
    required: false
    form: llm
    label:
      en_US: "Extraction source"
      zh_Hans: "提取来源"
      ja_JP: "抽出元"
    human_description:
      en_US: "Where full page content comes from. blend uses cache then a live fetch. cache is cache only. fetch always crawls. Only valid with full page."
      zh_Hans: "整页内容的来源。blend 先用缓存，没有再实时抓取。cache 只用缓存。fetch 总是实时抓取。仅整页模式有效。"
      ja_JP: "ページ全体の取得元。blend はキャッシュのあとライブ取得。cache はキャッシュのみ。fetch は常にクロール。full page のときだけ有効。"
    llm_description: "full_page only. blend serves cache when present and crawls otherwise. cache never crawls. fetch always crawls."
    default: blend
    options:
      - label:
          en_US: "Blend"
          zh_Hans: "混合"
          ja_JP: "ブレンド"
        value: blend
      - label:
          en_US: "Cache only"
          zh_Hans: "仅缓存"
          ja_JP: "キャッシュのみ"
        value: cache
      - label:
          en_US: "Live fetch"
          zh_Hans: "实时抓取"
          ja_JP: "ライブ取得"
        value: fetch
  - name: extraction_formats
    type: select
    required: false
    form: llm
    label:
