    human_description:
      en_US: "When true, operators such as quoted phrases and site: must match. When false, the API may relax operators that match nothing. Has no effect with highlights."
      zh_Hans: "为 true 时，引号短语和 site: 等运算符必须精确匹配。为 false 时，如果运算符没有命中，API 可能放宽条件。对 highlights 无效。"
      ja_JP: "true のとき、引用句や site: は厳密に一致する必要がある。false のとき、一致がない演算子は API が緩めることがある。highlights には効かない。"
    llm_description: "When true, search operators must match exactly. Default false. No effect with extraction_mode highlights."
